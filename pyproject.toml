[project]
name = "aircraft-db-tracker"
version = "0.1.0"
description = "Консольное приложение для анализа данных о самолетах в PostgreSQL"
authors = [
    {name = "Liamhoulet10031988", email = "liam10031988@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "types-requests (>=2.33.0.20260712,<3.0.0.0)",
    "types-psycopg2 (>=2.9.21.20260712,<3.0.0.0)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.isort]
profile = "black"
